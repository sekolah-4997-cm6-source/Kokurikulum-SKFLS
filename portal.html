<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSC Koku - SK Felda Laka Selatan</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts untuk tipografi moden -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

   <!-- Container untuk Navbar (Akan dimuatkan melalui app.js) -->
    <div id="navbar-container"></div>

    <!-- Ruangan Utama -->
    <main id="main-content">
        <!-- Header Atas -->
        <header>
            <div class="spacer"></div>
            <!-- Butang Admin Console -->
            <button id="btnAdmin" class="btn-admin" onclick="window.location.href='admin.html'">⚙️ Admin Console</button>
        </header>

        <!-- Kandungan Dashboard -->
        <div class="dashboard-container">
            <div class="hero-section">
                <h1>Selamat Datang ke Pusat Rujukan Kokurikulum</h1>
                <h2>SK Felda Laka Selatan</h2>
                <p>Sistem Pengurusan Dokumen dan Pemantauan Berpusat (Paperless)</p>
            </div>

            <!-- Pilihan Akses -->
            <div class="access-section" id="accessSection">
                <h3>Sila Pilih Akses Anda</h3>
                <div class="card-container">
                    <button class="access-card guru-card" id="btnGuru">
                        <div class="card-icon">👨‍🏫</div>
                        <h4>Guru / Pentadbir</h4>
                        <p>Log masuk untuk pengurusan fail dan kemas kini data.</p>
                    </button>
                    
                    <button class="access-card pelawat-card" id="btnPelawat">
                        <div class="card-icon">👥</div>
                        <h4>Pelawat / Pegawai</h4>
                        <p>Akses rujukan dan semakan fail tanpa log masuk.</p>
                    </button>
                </div>
            </div>
        </div>

        <!-- Infinite Scroll Gambar Guru -->
        <div class="slider-section">
            <h4>Barisan Guru Pemandu Kecemerlangan Kokurikulum</h4>
            <div class="slider">
                <div class="slide-track">
                    <!-- Gambar dari Firebase akan dimasukkan di sini secara automatik oleh app.js -->
                    <div style="text-align: center; color: #64748b;">⏳ Memuat turun gambar guru...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Fail Konfigurasi Firebase -->
    <script src="firebase-config.js"></script>

    <!-- Otak Utama Sistem -->
    <script src="app.js"></script>
</body>
</html>
