<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Utama - OSC Koku SK Felda Laka Selatan</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts untuk tipografi moden -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>

        /* CSS tambahan ringkas untuk reka letak Dashboard Utama */
        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            background-color: #f8f9fa;
            border-bottom: 2px solid #e2e8f0;
            margin-bottom: 30px;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 0 20px;
        }
        
        /* Kekalkan style butang log keluar */
        .btn-logout {
            padding: 10px 15px;
            background-color: #ef4444;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body>
    
    <!-- Container untuk Navbar (Akan dimuatkan melalui app.js) -->
    <div id="navbar-container"></div>

    <!-- Ruangan Utama -->
    <main id="main-content">
        
        <!-- Header Dashboard -->
        <header class="dashboard-header">
            <div>
                <h2>Dashboard Sistem</h2>
                <p>Pengurusan Dokumen & Pemantauan OSC Koku</p>
            </div>
            <!-- Butang Log Keluar akan kembali ke portal muka depan -->
            <button id="btnLogKeluar" class="btn-logout" onclick="window.location.href='portal.html'">🚪 Log Keluar</button>
        </header>

        <!-- Menu Utama Dashboard -->
        <div class="dashboard-grid">
            <!-- Kad-kad telah dikosongkan untuk sementara waktu -->
        </div>

    </main>

    <!-- Firebase SDK (Sama seperti fail asal) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Fail Konfigurasi Firebase -->
    <script src="firebase-config.js"></script>

    <!-- Otak Utama Sistem -->
    <script src="app.js"></script>
</body>
</html>
